nt-size:11px;margin:0 0 6px;display:flex;gap:9px;align-items:center}.meta strong{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}.bubble{background:var(--soft);padding:11px 14px;border-radius:3px 13px 13px 13px;white-space:pre-wrap;overflow-wrap:anywhere}.message.mine{flex-direction:row-reverse}.mine .avatar{background:var(--own);color:var(--owntext)}.mine .meta{justify-content:flex-end}.mine .bubble{background:var(--own);color:var(--owntext);border-radius:13px 3px 13px 13px}.file{display:flex;align-items:center;gap:12px;min-width:190px;text-decoration:none;color:inherit}.file-icon{display:grid;place-items:center;width:35px;height:42px;border:1px solid currentColor;border-radius:6px;font-size:9px;opacity:.65;flex-shrink:0}.file-info{min-width:0}.file-name{font-size:13px;font-weight:500;overflow-wrap:anywhere}.file-size{font-size:11px;opacity:.65;margin-top:2px}.chat-image{display:block;max-width:100%;max-height:240px;border-radius:8px;object-fit:contain}.composer{border-top:1px solid var(--line);padding:14px 20px 17px}.tools{display:flex;align-items:center;gap:4px}.tool{display:flex;align-items:center;gap:6px;padding:7px 9px;border:0;border-radius:7px;background:transparent;color:var(--sub);font-size:12px}.tool:hover{background:var(--soft);color:var(--ink)}svg{width:17px;height:17px;flex-shrink:0}.identity{margin-left:auto;color:var(--sub);font-size:11px}.identity b{font-weight:500;color:var(--ink)}textarea{resize:none;width:100%;min-height:85px;max-height:180px;padding:13px 8px 5px;border:0;background:transparent;color:var(--ink);outline:none;display:block}textarea{background:var(--soft);border-radius:8px}textarea::placeholder{color:var(--sub)}.send-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:7px}.hint{color:var(--sub);font-size:11px}.send{display:flex;align-items:center;gap:8px;border:0;border-radius:9px;padding:10px 20px;color:var(--owntext);background:var(--own);font-weight:500}.pending{display:flex;al .entry{width:100%;max-width:360px;margin:auto;padding: max(30px,12vh) 8px 20px}.entry-brand{font-size:25px;font-weight:650;letter-spacing:-.7px}.entry-sub{margin:3px 0 26px;color:var(--sub)}.entry-card{padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.entry-card h2{font-size:18px;margin:0 0 22px}.entry-card label{display:block;font-size:13px;margin-bottom:8px}.entry-card input{width:100%;padding:12px;border:0;border-radius:8px;background:var(--soft);color:var(--ink);font-size:16px;outline:none}.entry-card input:focus{background:color-mix(in srgb,var(--ink) 9%,var(--panel))}.entry-card .send{width:100%;justify-content:center;margin-top:18px}.entry-card p{font-size:12px;color:var(--sub);margin:12px 0 0}.entry-card p:empty{display:none}.entry-note{font-size:12px;color:var(--sub);text-align:center;margin-top:18px}

.aj-entry .entry-brand{margin:0}.aj-password{display:flex;align-items:center}.aj-password input{flex:1;width:100%;border:0;outline:none;background:transparent;color:var(--ink)}.aj-icon-button{border:0;background:transparent;color:var(--sub);padding:12px;display:grid;place-items:center}.aj-label{display:block}.aj-entry .aj-primary{display:flex;border:0;background:var(--own);color:var(--owntext);font-weight:500}.aj-entry-icon{color:var(--ink)}

<body>
<section class="aj-entry" id="entry" hidden><form class="aj-entry-card" id="entry-form"><div class="aj-entry-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div><h1 class="aj-entry-name entry-brand">S View</h1><p class="aj-entry-sub">输入访问码，加入聊天</p>      <div class="aj-auth"><label class="aj-label" for="entry-code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="m12 12 9 9m-3-3 3-3m-6 0 3-3"/></svg>访问码</label><div class="aj-password"><input id="entry-code" type="password" placeholder="输入访问码" maxlength="64" autocomplete="current-password" aria-describedby="entry-error"><button class="aj-icon-button cursor-interaction" id="aj-eye" aria-label="显示访问码" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><p class="aj-entry-error" id="entry-error" role="alert"></p><button type="submit" class="aj-primary">加入聊天 <span aria-hidden="true">→</span></button><div class="aj-entry-footer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>局域网聊天</div></form></section>
<main id="chat-page" hidden>
<header><div><h1>S View</h1><p class="subtitle">局域网聊天</p></div><span class="badge" id="connection">连接中…</span></header>
<section class="room" aria-label="公共聊天">
<div class="room-top"><div class="room-title"><span id="room-name">S View</span><small>文字、图片和文件，一起分享。</small></div><button type="button" class="tool" id="leave">退出聊天</button></div>
<div class="timeline" id="timeline" role="log" aria-label="聊天记录" aria-live="polite"></div>
<form class="composer" id="composer">
<div class="tools"><button type="button" class="tool" id="choose-image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg>图片</button><button type="button" class="tool" id="choose-file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M14 3H5v18h14V8Zm0 0v6h5"/></svg>文件</button><span class="identity" aria-live="polite"><span id="identity-label"><b id="identity"></b></span><span id="notice" hidden></span></span></div>
<input id="image-input" type="file" accept="image/*" hidden><input id="file-input" type="file" hidden>
<div class="pending" id="pending" hidden><img id="pending-image" alt="待发送图片" hidden><span id="pending-name"></span><button type="button" class="remove" id="remove" aria-label="移除附件">×</button></div>
<textarea id="message" maxlength="2000" placeholder="发一条消息…" aria-label="消息"></textarea>
<div class="send-row"><span class="hint">Enter 发送 · Shift + Enter 换行</span><button class="send" type="submit">发送<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m5 12 14-7-7 14-1-7Zm6 2 8-9"/></svg></button></div>
</form></section>

</main>
<script>
// 与上传页一致，通过 options.name 配置所有名称。
const requiresToken=__REQUIRES_TOKEN__;
const options={name:document.querySelector('meta[name="sview-name"]').content};
function updateChatName(name){
 const value=typeof name==='string'&&name.trim()?name.trim():'S View';
 options.name=value;
 document.querySelector('.entry-brand').textContent=value;
 document.querySelector('#chat-page h1').textContent=value;
 document.getElementById('room-name').textContent=value;
 document.querySelector('.room').setAttribute('aria-label',value);
 document.title=value;
}
updateChatName(options.name);


'use strict';

(function(){
 let frame=0;
 function fit(){frame=0;const height=window.visualViewport?window.visualViewport.height:window.innerHeight;document.documentElement.style.setProperty('--visible-height',Math.floor(height)+'px');}
 function schedule(){if(!frame)frame=requestAnimationFrame(fit);}
 window.addEventListener('resize',schedule);window.addEventListener('orientationchange',schedule);window.addEventListener('pageshow',schedule);
 if(window.visualViewport){window.visualViewport.addEventListener('resize',schedule);window.visualViewport.addEventListener('scroll',schedule);}
 fit();
})();

const $=id=>document.getElementById(id),limits={file:__MAX_FILE_MB__*1048576,image:__MAX_IMAGE_MB__*1048576};
let joined=false,identity='',session='',cursor=0,timer=null,pending=null,previewUrl=null,upload=null,sending=false,generation=0;
function setNotice(text){$('notice').textContent=text;$('notice').hidden=!text;$('identity-label').hidden=!!text;}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function bytes(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';}
function clearPending(){pending=null;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;$('pending').hidden=true;$('pending-image').removeAttribute('src');$('image-input').value='';$('file-input').value='';}
function gate(message=''){setNotice('');generation++;joined=false;clearTimeout(timer);upload?.abort();$('chat-page').hidden=true;$('entry').hidden=false;$('timeline').replaceChildren();$('entry-error').textContent=message;cursor=0;clearPending();}
async function api(path,options={}){const controller=new AbortController(),t=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(path,{...options,cache:'no-store',credentials:'same-origin',signal:controller.signal});const data=await r.json();if(!r.ok){if(r.status===401&&joined)gate('请重新输入访问码');throw Error(data.message||'请求失败');}return data;}finally{clearTimeout(t);}}
function append(m){const timeline=$('timeline'),nearEnd=timeline.scrollHeight-timeline.scrollTop-timeline.clientHeight<100;let row;
if(m.system){row=el('div','system-message');row.append(el('strong','','系统消息'),el('span','',m.text));}
else{const mine=m.senderId===identity;row=el('div','message'+(mine?' mine':''));row.append(el('div','avatar',m.senderId.slice(-2)));const body=el('div','message-body'),meta=el('div','meta');meta.append(el('strong','',m.senderId+(mine?' · 我':'')),el('span','',new Date(m.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})));body.append(meta);const bubble=el('div','bubble'),url='/attachment/'+m.id;
if(m.type==='image'){const img=el('img','chat-image');img.src=url;img.alt=m.name;img.loading='lazy';img.decoding='async';img.onload=()=>{if(nearEnd)timeline.scrollTop=timeline.scrollHeight;};bubble.append(img);const a=el('a','image-download');a.href=url+'?download=1';a.download=m.name;a.append(el('span','',m.name),el('b','','下载图片 ↓'));bubble.append(a);}
else if(m.type==='file'){const a=el('a','file');a.href=url+'?download=1';a.download=m.name;a.append(el('div','file-icon',m.name.split('.').pop().slice(0,4).toUpperCase()));const info=el('div','file-info');info.append(el('div','file-name',m.name),el('div','file-size',bytes(m.size)));a.append(info,el('span','download-mark','下载 ↓'));bubble.append(a);}else bubble.textContent=m.text;body.append(bubble);row.append(body);}
timeline.append(row);if(nearEnd)timeline.scrollTop=timeline.scrollHeight;}
async function poll(epoch){if(!joined||epoch!==generation)return;let delay=250;try{let more;do{const data=await api('/messages?after='+cursor);if(!joined||epoch!==generation)return;if(data.sessionId!==session){gate('聊天已重新启动，请重新加入');return;}for(const m of data.messages)append(m);cursor=data.cursor;more=data.more;}while(more);$('connection').textContent='已连接';}catch(e){delay=2000;if(joined)$('connection').textContent='连接中断，重试中…';}finally{if(joined&&epoch===generation)timer=setTimeout(()=>poll(epoch),delay);}}
async function joinChat(){const button=$('entry-form').querySelector('button[type=submit]');button.disabled=true;$('entry-error').textContent='';try{const data=await api('/join',{method:'POST',headers:{'X-SView-Token':$('entry-code').value},body:''});identity=data.id;session=data.sessionId;$('identity').textContent=identity;setNotice('');$('entry-code').value='';$('entry').hidden=true;$('chat-page').hidden=false;$('timeline').replaceChildren();cursor=0;joined=true;generation++;clearTimeout(timer);poll(generation);}catch(e){$('entry').hidden=false;$('entry-error').textContent=e.name==='AbortError'?'连接超时，请重试':e.message||'连接失败';}finally{button.disabled=false;}};
$('entry-form').onsubmit=e=>{e.preventDefault();joinChat();};
$('aj-eye').onclick=()=>{const input=$('entry-code');input.type=input.type==='password'?'text':'password';$('aj-eye').setAttribute('aria-label',input.type==='password'?'显示访问码':'隐藏访问码');};
$('entry-code').closest('.aj-auth').hidden=!requiresToken;
if(!requiresToken)document.querySelector('.aj-entry-sub').textContent='局域网聊天';
$('entry').hidden=!requiresToken;
if(!requiresToken)joinChat();
$('leave').onclick=async()=>{gate();try{await api('/leave',{method:'POST',body:''});}catch(_){}$('entry-code').focus();};
function pick(file,type){if(!file||sending)return;setNotice('');if(file.size>limits[type]){setNotice((type==='image'?'图片':'文件')+'最大 '+bytes(limits[type]));return;}if(type==='image'&&!file.type.startsWith('image/')){setNotice('请选择图片');return;}clearPending();pending={file,type};$('pending-name').textContent=file.name+' · '+bytes(file.size);$('pending-image').hidden=type!=='image';if(type==='image'){previewUrl=URL.createObjectURL(file);$('pending-image').src=previewUrl;}$('pending').hidden=false;}
$('choose-image').onclick=()=>$('image-input').click();$('choose-file').onclick=()=>$('file-input').click();$('image-input').onchange=e=>pick(e.target.files[0],'image');$('file-input').onchange=e=>pick(e.target.files[0],'file');$('remove').onclick=()=>{if(!sending)clearPending();};
function sendFile(item){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();upload=xhr;let last=0;xhr.open('POST','/'+item.type+'?name='+encodeURIComponent(item.file.name));xhr.setRequestHeader('Content-Type','application/octet-stream');xhr.upload.onprogress=e=>{const now=Date.now();if(now-last<1000&&e.loaded!==e.total)return;last=now;setNotice(e.loaded===e.total?'正在保存…':'上传 '+Math.floor(e.loaded*100/(e.total||1))+'%');};xhr.onload=()=>{try{const data=JSON.parse(xhr.responseText);if(xhr.status===200)resolve(data);else{if(xhr.status===401)gate('请重新输入访问码');reject(Error(data.message||'上传失败'));}}catch(e){reject(e);}};xhr.onerror=()=>reject(Error('上传中断，请重试'));xhr.onabort=()=>reject(Error('上传已取消'));xhr.onloadend=()=>{upload=null;};xhr.send(item.file);});}
$('composer').onsubmit=async e=>{e.preventDefault();if(!joined||sending)return;const text=$('message').value.trim(),item=pending,epoch=generation;if(!text&&!item)return;sending=true;const button=$('composer').querySelector('button[type=submit]');button.disabled=true;setNotice('发送中…');try{if(item){await sendFile(item);if(epoch!==generation)return;clearPending();}if(text){await api('/send',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:text});if(epoch!==generation)return;if($('message').value.trim()===text)$('message').value='';}setNotice('');}catch(e){if(joined)setNotice(e.message||'发送失败');}finally{sending=false;button.disabled=false;}};
$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();$('composer').requestSubmit();}};
window.addEventListener('pagehide',()=>{generation++;joined=false;clearTimeout(timer);upload?.abort();if(previewUrl)URL.revokeObjectURL(previewUrl);});
</script></body></html>
